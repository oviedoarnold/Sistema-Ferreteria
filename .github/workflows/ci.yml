name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verificar:
    name: Lint, tests y build
    runs-on: ubuntu-latest

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
        with:
          # SonarCloud necesita el historial para atribuir el codigo nuevo.
          fetch-depth: 0

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      # Los tres pasos siguientes bloquean: si el lint marca algo, un test
      # falla o el build se rompe, el pipeline queda en rojo y el commit no
      # se considera bueno.
      - name: Lint
        run: npm run lint

      - name: Tests con cobertura
        run: npm run coverage

      - name: Build de producción
        run: npm run build

      # Se omite mientras no exista el secreto SONAR_TOKEN, para no dejar
      # el pipeline en rojo antes de conectar el proyecto en SonarCloud.
      - name: SonarCloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v4

      - name: Publicar el reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage/
          retention-days: 30
